<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zorvex</title>
<style>
:root{--bg1:#1a0b33;--bg2:#4a2480;--orb1:#9b5cff;--orb2:#ff6ad5;--orb3:#4aa8ff;--card:rgba(150,100,220,.28);--text:#f0e8ff;--muted:#c9b6ee;--line:rgba(255,255,255,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#12062a;--bg2:#36186b}}
:root[data-theme="dark"]{--bg1:#12062a;--bg2:#36186b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg2),var(--bg1));color:var(--text);font-family:"Unbounded","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:28px 16px;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;animation:drift 18s ease-in-out infinite alternate}
.o1{width:320px;height:320px;background:var(--orb1);top:-60px;left:-80px}
.o2{width:280px;height:280px;background:var(--orb2);bottom:8%;right:-90px;animation-duration:23s}
.o3{width:240px;height:240px;background:var(--orb3);top:45%;left:-60px;animation-duration:27s}
@keyframes drift{to{transform:translate(60px,-80px) scale(1.25)}}
canvas{position:fixed;inset:0;z-index:1;pointer-events:none}
main{position:relative;z-index:2;width:100%;max-width:430px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:28px;padding:28px 22px;text-align:center}
.avatar{position:relative;width:132px;height:132px;margin:0 auto 18px}
.avatar .ring{position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,#fff,#b98cff,#ff8be0,#6fc3ff,#fff);animation:spin 6s linear infinite;filter:blur(1px)}
.avatar .glow{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(190,140,255,.7),transparent 68%);animation:pulse 3s ease-in-out infinite}
.avatar .pic{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#c9a8ff 30%,#5a2fb0 75%);display:grid;place-items:center;font-size:54px;border:4px solid #2a1252;overflow:hidden}
.avatar .pic img{width:100%;height:100%;object-fit:cover}
.sp{position:absolute;width:8px;height:8px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45;transform:scale(1.08)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2)}}
h1{margin:0 0 8px;font-size:30px;font-weight:700;letter-spacing:.5px;text-shadow:0 0 18px rgba(200,150,255,.9)}
.bio{margin:0 auto 14px;font-size:15px;line-height:1.6;color:var(--muted);max-width:32ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.tags span{padding:6px 12px;border:1px solid var(--line);border-radius:99px;font-size:13px;background:rgba(255,255,255,.08)}
.links{display:grid;gap:10px}
.links a{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:15px;transition:transform .15s,background .15s}
.links a:hover,.links a:focus-visible{transform:translateY(-2px);background:rgba(255,255,255,.2);outline:2px solid #fff;outline-offset:2px}
.links svg{width:22px;height:22px;flex:none;fill:currentColor}
.links small{margin-left:auto;color:var(--muted);font-size:12px}
.music{display:flex;align-items:center;gap:14px;padding:16px;text-align:left;border-radius:26px;background:rgba(60,30,100,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);color:var(--text);text-decoration:none}
.cover{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#6a7bff,#b34dff);display:grid;place-items:center;font-size:28px;flex:none}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px;margin-top:6px}
.eq i{width:4px;background:#d8b8ff;border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.6s}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}
.music b{display:block;font-size:15px}
.music span{font-size:12px;color:var(--muted)}
.play{margin-left:auto;width:44px;height:44px;border-radius:50%;background:#fff;color:#3a1a70;display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px;fill:currentColor}
@media (prefers-reduced-motion:reduce){*{animation:none!important}canvas{display:none}}
</style>
</head>
